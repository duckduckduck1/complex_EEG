[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# URL задаётся в alembic/env.py из app.core.config.Settings.
# Здесь оставляем безопасную заглушку, чтобы не хранить секреты в ini-файле.
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S