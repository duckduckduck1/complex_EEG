<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Лаборатория Умного сна{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/experiments">Лаборатория «Умного сна»</a>
    {% if user %}
    <nav class="userbar">
      <span class="user">{{ user.username }} · {{ user.role }}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="link-btn">Выйти</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
