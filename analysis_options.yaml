# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Вендоренный форк нативного плагина: правим только его C++, Dart-часть —
    # копия апстрима, линтовать её не нужно (см. third_party/.../README_FORK.md).
    - third_party/**

linter:
  # Правило можно погасить точечно комментарием `// ignore: name_of_lint`
  # над строкой или `// ignore_for_file: name_of_lint` на весь файл.
  #
  # Сверх flutter_lints включены правила про производительность и утечки.
  # Смысл: такие вещи должен ловить анализатор на каждом прогоне, а не человек
  # глазами раз в полгода. Когда включили в первый раз, нашлась 31 штука,
  # включая настоящую гонку при закрытии сессии устройства.
  rules:
    # Пропущенный const — лишняя пересборка поддерева на каждый кадр.
    # На живых графиках это 60 раз в секунду на каждое устройство.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    # Лишние обёртки: Container ради одного свойства тащит за собой
    # декорирование, отступы и клип, которых не просили.
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    # Незамеченный Future — источник гонок при закрытии: подписка ещё жива,
    # а bloc уже закрывают. Ровно так у нас и было.
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    # Асинхронные dart:io-проверки существования медленнее синхронных.
    - avoid_slow_async_io
    - unnecessary_lambdas
    - prefer_final_locals

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
