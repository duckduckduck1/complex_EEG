groups:
  - name: complex_eeg_basic
    rules:
      - alert: ComplexEegApiDown
        expr: up{job="api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API is down

      - alert: ComplexEegPostgresDown
        expr: up{job="postgres"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is down

      - alert: ComplexEegDiskUsageWarning
        expr: >
          (1 - node_filesystem_avail_bytes{fstype!="tmpfs"}
               / node_filesystem_size_bytes{fstype!="tmpfs"}) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Disk usage above 80%

      - alert: ComplexEegDiskUsageCritical
        expr: >
          (1 - node_filesystem_avail_bytes{fstype!="tmpfs"}
               / node_filesystem_size_bytes{fstype!="tmpfs"}) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Disk usage above 90%

      - alert: ComplexEegPostgresBackupFailed
        expr: complex_eeg_postgres_backup_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL backup failed on last run

      - alert: ComplexEegFilesBackupFailed
        expr: complex_eeg_files_backup_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Files backup failed on last run

      - alert: ComplexEegPostgresBackupStale
        expr: time() - complex_eeg_postgres_backup_last_success_timestamp > 129600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL backup not successful for more than 36h

      - alert: ComplexEegFilesBackupStale
        expr: time() - complex_eeg_files_backup_last_success_timestamp > 129600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Files backup not successful for more than 36h

      - alert: ComplexEegContainerRestartLoop
        # cadvisor tracks container start time; changes > 2 means 3+ restarts in 15m
        expr: changes(container_start_time_seconds{image!=""}[15m]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting too frequently"
