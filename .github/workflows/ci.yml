name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  docs-and-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check trailing whitespace
        run: |
          ! git grep -nI '[[:blank:]]$' -- .

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/backup/*.sh

      - name: Install Ansible
        run: python -m pip install --upgrade ansible-core

      - name: Validate Ansible playbooks
        working-directory: infra/ansible
        run: |
          ansible-playbook --syntax-check playbooks/bootstrap.yml
          ansible-playbook --syntax-check playbooks/deploy.yml
          ansible-playbook --syntax-check playbooks/backup.yml
          ansible-playbook --syntax-check playbooks/monitoring.yml
